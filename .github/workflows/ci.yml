name: CI

# Build + test on every push/PR to main. Publishing the Docker images lives in docker.yml.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install WASM workload (Blazor PWA)
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore PlaylistShare.slnx

      - name: Build (Release)
        run: dotnet build PlaylistShare.slnx -c Release --no-restore

      - name: Test (Release)
        run: dotnet test PlaylistShare.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore
