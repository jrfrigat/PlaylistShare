    <circle cx="256" cy="256" r="206" fill="url(#halo)"/>
    <g fill="none" stroke="url(#neon)" stroke-linecap="round">
      <circle cx="256" cy="256" r="88"  stroke-width="14"/>
      <circle cx="256" cy="256" r="152" stroke-width="11" opacity="0.62"/>
      <circle cx="256" cy="256" r="216" stroke-width="8"  opacity="0.34"/>
    </g>
    <path d="M224 202 L224 310 L318 256 Z" fill="url(#neon)" stroke="url(#neon)" stroke-width="20" stroke-linejoin="round"/>
  </g>

  <text x="288" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="88" font-weight="700" fill="url(#neonH)">PlaylistShare</text>
  <text x="292" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#c9c6d0">Share Yandex Music playlists - and collaborate on them in real time</text>
  <text x="292" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#8f8aa0">.NET 10&#160;&#160;-&#160;&#160;Blazor WebAssembly&#160;&#160;-&#160;&#160;SQL Server / PostgreSQL</text>
