<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98cff"/>
      <stop offset="1" stop-color="#e76edf"/>
    </linearGradient>
    <linearGradient id="neonH" gradientUnits="userSpaceOnUse" x1="290" y1="0" x2="870" y2="0">
      <stop offset="0" stop-color="#c49bff"/>
      <stop offset="1" stop-color="#ef7ae7"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#c77bff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#a06aec" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0e0c12" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" fill="#0e0c12"/>
  <circle cx="1120" cy="30" r="240" fill="url(#halo)"/>
  <circle cx="30" cy="300" r="180" fill="url(#halo)"/>

  <!-- App mark -->
  <g transform="translate(66,64) scale(0.34)">
